project:
  type: website
  output-dir: _site
  pre-render:
    - _marimo_export.py
  resources:
    - "wasm-local/**"
  preview:
    port: 7777
  render:
    - "*.qmd"
    - "syllabus/**/*.qmd"
    - "introduction/**/*.qmd"
    - "units/**/*.qmd"
    - "assignments/**/*.qmd"
    - "project/**/*.qmd"
    - "seminars/**/*.qmd"
    - "!templates/**"

website:
  title: "MATE 374 · Computational Methods in Materials Engineering"
  favicon: assets/uofa-crest.svg
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "University of Alberta · Faculty of Engineering"
    right: "MATE 374 · Computational Methods in Materials Engineering"
  navbar:
    title: "MATE 374"
    left:
      - href: index.qmd
        text: Home
      - href: syllabus/index.qmd
        text: Syllabus
      - href: introduction/index.qmd
        text: Introduction
      - href: units/index.qmd
        text: Units
      - href: seminars/index.qmd
        text: Seminars
      - href: assignments/index.qmd
        text: Assignments
      - href: project/index.qmd
        text: Project
    right:
      - text: "Faculty of Engineering"
        href: https://www.ualberta.ca/en/engineering/
        aria-label: "University of Alberta Faculty of Engineering"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Course home
      - href: syllabus/index.qmd
        text: Syllabus
      - href: introduction/index.qmd
        text: Introduction
      - section: "Units"
        href: units/index.qmd
        contents:
          - section: "01 · Numerical thinking"
            href: units/01/index.qmd
            contents:
              - href: units/01/L01/index.qmd
                text: "L01"
              - href: units/01/L02/index.qmd
                text: "L02"
              - href: units/01/L03/index.qmd
                text: "L03"
              - href: units/01/L04/index.qmd
                text: "L04"
              - href: units/01/references.qmd
                text: "References"
          - section: "02 · Finding special points"
            href: units/02/index.qmd
            contents:
              - href: units/02/L05/index.qmd
                text: "L05"
              - href: units/02/L06/index.qmd
                text: "L06"
              - href: units/02/L07/index.qmd
                text: "L07"
              - href: units/02/L08/index.qmd
                text: "L08"
              - href: units/02/references.qmd
                text: "References"
          - section: "03 · Functions and data"
            href: units/03/index.qmd
            contents:
              - href: units/03/L09/index.qmd
