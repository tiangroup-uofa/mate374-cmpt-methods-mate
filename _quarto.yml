project:
  type: website
  output-dir: _site
  pre-render:
    - _marimo_export.py
  resources:
    - "wasm-local/**"
  preview:
    port: 7777
  render:
    - "*.qmd"
    - "syllabus/**/*.qmd"
    - "units/**/*.qmd"
    - "assignments/**/*.qmd"
    - "project/**/*.qmd"
    - "!templates/**"

website:
  title: "MATE 374 · Computational Methods in Materials Engineering"
  favicon: assets/uofa-crest.svg
  page-navigation: true
  back-to-top-navigation: true
  page-footer:
    left: "University of Alberta · Faculty of Engineering"
    right: "MATE 374 · Computational Methods in Materials Engineering"
  navbar:
    title: "MATE 374"
    left:
      - href: index.qmd
        text: Home
      - href: syllabus/index.qmd
        text: Syllabus
      - href: units/index.qmd
        text: Course notes
      - href: assignments/index.qmd
        text: Assignments
      - href: project/index.qmd
        text: Project
    right:
      - text: "Faculty of Engineering"
        href: https://www.ualberta.ca/en/engineering/
        aria-label: "University of Alberta Faculty of Engineering"
  sidebar:
    style: docked
    search: true
    contents:
      - href: index.qmd
        text: Course home
      - href: syllabus/index.qmd
        text: Syllabus
      - section: "Course notes"
        href: units/index.qmd
        contents:
          - href: units/front-matter/index.qmd
            text: "L00 · Course introduction"
          - section: "0 · Orientation and numerical thinking"
            href: units/00-orientation/index.qmd
            contents:
              - href: units/00-orientation/L01/index.qmd
                text: "L01 · A numerical mindset"
              - href: units/00-orientation/L02/index.qmd
                text: "L02 · Choosing a numerical method"
              - href: units/00-orientation/L03/index.qmd
                text: "L03 · Numbers inside a computer"
              - href: units/00-orientation/L04/index.qmd
                text: "L04 · Making computation faster"
              - href: units/00-orientation/references.qmd
                text: "Unit 0 · References"
          - section: "1 · Finding special points"
            href: units/01-finding-answers/index.qmd
            contents:
              - href: units/01-finding-answers/L05/index.qmd
                text: "L05 · Brackets, bisection, and fixed points"
              - href: units/01-finding-answers/L06/index.qmd
                text: "L06 · Secant and Newton methods"
              - href: units/01-finding-answers/L07/index.qmd
                text: "L07 · One-dimensional minimization"
              - href: units/01-finding-answers/L08/index.qmd
                text: "L08 · Optimization landscapes"
              - href: units/01-finding-answers/references.qmd
                text: "Unit 1 · References"
          - section: "2 · Functions and data"
            href: units/02-functions-data/index.qmd
            contents:
              - href: units/02-functions-data/L09/index.qmd
                text: "L09 · Numerical differentiation"
              - href: units/02-functions-data/L10/index.qmd
                text: "L10 · Numerical integration"
              - href: units/02-functions-data/L11/index.qmd
                text: "L11 · Interpolation"
              - href: units/02-functions-data/L12/index.qmd
                text: "L12 · Curve fitting and regression"
              - href: units/02-functions-data/references.qmd
                text: "Unit 2 · References"
          - section: "Appendices"
            href: appendices/index.qmd
            contents:
              - href: appendices/A01-python-numerics/index.qmd
                text: "A1 · Python for numerical work"
      - href: assignments/index.qmd
        text: Assignments
      - href: project/index.qmd
        text: Project

filters:
  - filters/marimo-iframe.lua
  - filters/quarto-wasm-local.lua

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    include-in-header:
      - assets/browser-theme.html
    include-after-body:
      - assets/class-view.html
    toc: true
    code-tools: true
    code-fold: true
    code-summary: "Show the code"
    link-external-newwindow: true
    format-links: true
  pdf:
    toc: true
