          - href: seminars/S01-python-numerics/index.qmd
            text: "S01 · Python for numerical work"
      - href: assignments/index.qmd
        text: Assignments
      - href: project/index.qmd
        text: Project

filters:
  - filters/marimo-iframe.lua
  - filters/quarto-wasm-local.lua

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    css: styles.css
    include-in-header:
      - assets/browser-theme.html
    include-after-body:
      - assets/class-view.html
    toc: true
    code-tools: true
    code-fold: true
    code-summary: "Show the code"
    link-external-newwindow: true
    format-links: true
  pdf:
    toc: false
    mainfont: "TeX Gyre Heros"
    sansfont: "TeX Gyre Heros"
    fontsize: 11pt
    geometry:
      - margin=1in
