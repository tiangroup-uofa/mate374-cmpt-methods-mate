[project]
name = "mate374-course"
version = "0.1.0"
description = "Source and interactive examples for MATE 374"
requires-python = ">=3.11"
dependencies = [
  "anywidget>=0.9",
  "ase>=3.26",
  "lzstring>=1.0.4",
  "marimo>=0.23.16",
  "matplotlib>=3.11.1",
  "numpy>=2.0",
  "scipy>=1.14",
  "traitlets>=5",
  "weas-widget>=0.2.6",
]

[tool.marimo.runtime]
# Embedded course demos should become live without requiring a manual Run all.
auto_instantiate = true
