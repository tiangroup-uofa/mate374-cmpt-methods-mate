name: Render and deploy course site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked Python environment
        run: uv sync --locked

      - name: Cache TinyTeX (LaTeX package tree)
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          # The workflow hash changes when the package list or Quarto version changes.
          # Keep page edits from creating a new copy of the large TinyTeX cache.
          key: tinytex-${{ runner.os }}-${{ hashFiles('.github/workflows/render_pages.yml') }}
          restore-keys: |
            tinytex-${{ runner.os }}-

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.30"
          # Idempotent when the cache above already restored ~/.TinyTeX.
          tinytex: true

      - name: Pre-install common LaTeX packages
        run: |
          # Batch-install the packages Quarto's KOMA-Script + XeLaTeX PDF path
          # needs so a cold cache warms in one step instead of many slow on-demand
          # tlmgr calls during render. On a warm cache these are already present.
          tlmgr update --self
          tlmgr install \
            koma-script caption fancyvrb fvextra framed booktabs etoolbox \
            xcolor colortbl geometry hyperref bookmark footnotehyper upquote \
            environ trimspaces ulem unicode-math fontspec euenc xetex \
            tex-gyre tex-gyre-math amsmath pdftexcmds infwarerr kvoptions \
            ltxcmds epstopdf-pkg

      - name: Install SVG support
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render complete Quarto site (HTML and PDF)
        run: quarto render --profile full

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
