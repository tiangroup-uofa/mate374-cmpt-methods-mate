<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="85mm" viewBox="0 5 160 85" version="1.1">
<title>Richardson extrapolation of the trapezoidal rule</title>
<desc>Two trapezoidal estimates of the same integral, I(h) with one subinterval of width h and I(h/2) with two subintervals of width h/2, each with error O(h squared). Arrows merge them into the Richardson combination (4 I(h/2) minus I(h)) divided by 3, whose error is O(h to the fourth), the same accuracy as Simpson 1/3 rule.</desc>
