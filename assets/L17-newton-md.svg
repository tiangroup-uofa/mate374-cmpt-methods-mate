  <title
     id="title1">Newton's second law combines differentiation and integration in molecular dynamics</title>
  <desc
     id="desc1">Left: F = m a. The force is the negative gradient of the energy (differentiation, red). The acceleration is the first time derivative of velocity and the second of position, so positions follow by integration (green). Right: atoms with force arrows and dashed recent paths, repeated every time step in molecular dynamics.</desc>
