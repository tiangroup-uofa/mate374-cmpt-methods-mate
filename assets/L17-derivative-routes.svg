<title>Two numerical routes to a derivative from sampled data</title>
<desc>Panel a: the slope at x_i is estimated from the neighbouring samples x_(i-1) and x_(i+1) by a finite difference. Panel b: a smooth function is fitted to scattered samples and its analytical derivative gives the slope at x_i.</desc>
