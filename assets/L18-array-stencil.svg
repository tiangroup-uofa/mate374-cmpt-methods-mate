<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="72mm" viewBox="0 0 160 72">
<title>Central differences on a NumPy array</title>
<desc>Two rows of array cells, f and fp. fp[1] is computed from f[0] and f[2]. The slices f[:-2] and f[2:] line up the left and right neighbours of every interior point. The end cells of fp use three-point one-sided formulas.</desc>
