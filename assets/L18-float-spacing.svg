<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="58mm" viewBox="0 0 160 58">
<title>Two energies closer than the floating-point spacing are stored as the same number</title>
<desc>A number line of energies near minus 10 to the 8 eV. Stored float64 values are 1.49e-8 eV apart. The exact energies E(q-h) and E(q+h), 4.05e-9 and 6.05e-9 eV above minus 10 to the 8, both lie closer to minus 10 to the 8 than to the next stored value, so both are stored as minus 10 to the 8 eV.</desc>
