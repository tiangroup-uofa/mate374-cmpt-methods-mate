<script>
(() => {
  const VIEW_PARAM = "view";
  const CLASS_VALUE = "class";

  const initialize = () => {
    if (!document.body.classList.contains("lecture-page")) return;

    const switcher = document.createElement("button");
    switcher.className = "course-view-switch";
    switcher.type = "button";
    document.body.appendChild(switcher);

    const urlFor = (classView) => {
      const url = new URL(window.location.href);
      if (classView) {
        url.searchParams.set(VIEW_PARAM, CLASS_VALUE);
      } else {
        url.searchParams.delete(VIEW_PARAM);
      }
      return url;
    };

    const isClassView = () =>
      new URL(window.location.href).searchParams.get(VIEW_PARAM) === CLASS_VALUE;

    const applyView = () => {
      const classView = isClassView();
      const targetLabel = classView ? "reading" : "class";
      document.body.classList.toggle("class-view", classView);

      switcher.setAttribute("aria-label", `Switch to ${targetLabel} view`);
      switcher.setAttribute("title", `Switch to ${targetLabel} view`);
      switcher.setAttribute("aria-pressed", classView ? "true" : "false");
      switcher.innerHTML = classView
        ? '<i class="bi bi-book" aria-hidden="true"></i>'
        : '<i class="bi bi-easel2" aria-hidden="true"></i>';

      window.requestAnimationFrame(() => {
        window.dispatchEvent(new Event("resize"));
      });
    };

    switcher.addEventListener("click", () => {
      window.history.replaceState({}, "", urlFor(!isClassView()));
      applyView();
    });
    window.addEventListener("popstate", applyView);
    applyView();
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialize, { once: true });
  } else {
    initialize();
  }
})();
</script>
