  <title
     id="title1">The central second difference compares f(x) with the average of its neighbours</title>
  <desc
     id="desc1">On a concave curve, the midpoint of the chord joining (x-h, f(x-h)) and (x+h, f(x+h)) lies below f(x). The numerator f(x-h) - 2f(x) + f(x+h) is twice the signed gap and is negative, matching a negative f''(x).</desc>
