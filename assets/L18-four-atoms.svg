<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="68mm" viewBox="0 0 160 68">
<title>Four atoms have twelve coordinate directions</title>
<desc>Four atoms at the corners of a square, numbered 1 and 2 on top and 3 and 4 below. Each atom has three short arrows for its x (red, oblique), y (green, right), and z (blue, up) coordinates. A dashed copy of atom 2 is displaced upwards along z2 by a small step h. A coordinate triad is drawn at the left.</desc>
