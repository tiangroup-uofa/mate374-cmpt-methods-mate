<circle cx="88" cy="62" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="82" cy="68" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
