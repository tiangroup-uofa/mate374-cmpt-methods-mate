<text x="30" y="7" style="font-family:Arial;font-size:6.35px;text-anchor:middle;fill:#231f20;font-weight:bold">NVE</text>
<text x="30" y="14" style="font-family:Arial;font-size:3.6px;text-anchor:middle;fill:#231f20;font-weight:normal">Microcanonical</text>
<rect x="13" y="38" width="34" height="43" style="fill:url(#insulation);stroke:#231f20;stroke-width:0.5" />
<rect x="17" y="42" width="26" height="35" style="fill:white;stroke:#231f20;stroke-width:0.5" />
<path d="M17,42 H43" style="fill:none;stroke:#231f20;stroke-width:0.9;" />
<text x="30" y="29" style="font-family:Arial;font-size:3.8px;text-anchor:middle;fill:#231f20;font-weight:normal">Insulated vessel</text>
<path d="M30,31 V36" style="fill:none;stroke:#5e5e5e;stroke-width:0.3;" />
<circle cx="22" cy="54" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="30" cy="56" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="38" cy="53" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="25" cy="63" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="35" cy="65" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="22" cy="73" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="31" cy="74" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<circle cx="38" cy="71" r="1.65" style="fill:url(#sample-atom);stroke:#5e5e5e;stroke-width:0.2" />
<text x="30" y="95" style="font-family:Arial;font-size:3.6px;text-anchor:middle;fill:#231f20;font-weight:normal">No heat or volume work</text>
</g>
