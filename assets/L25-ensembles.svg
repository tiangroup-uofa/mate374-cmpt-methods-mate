<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="180mm" height="101mm" viewBox="0 0 180 101">
<title>Physical boundary conditions for NVE, NVT and NPT</title>
<desc>Three cross-sectional apparatus schematics contain the same eight sample atoms. NVE has a sealed rigid insulated vessel. NVT has a sealed rigid vessel immersed in a larger constant-temperature bath. NPT has a sealed cylinder with a weighted movable piston in a constant-temperature bath. Heat passes through the conducting walls but particles do not. Piston motion permits volume work in NPT.</desc>
<defs>
<marker id="tri" orient="auto-start-reverse" markerWidth="1" markerHeight="1" viewBox="0 0 1 1" refX="0" refY="0" style="overflow:visible" preserveAspectRatio="xMidYMid"><path transform="scale(0.5)" d="M 5.77,0 -2.88,5 V -5 Z" style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt" /></marker>
<pattern id="insulation" patternUnits="userSpaceOnUse" width="1.8" height="1.8" patternTransform="rotate(45)"><rect width="1.8" height="1.8" style="fill:#f1f1f1" /><path d="M0,0 V1.8" style="fill:none;stroke:#8a8f98;stroke-width:0.35" /></pattern>
<radialGradient id="sample-atom" cx=".5" cy=".5" r=".5" fx=".35" fy=".32"><stop offset="0" stop-color="white" /><stop offset="1" stop-color="#8a8f98" /></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a8f98" /><stop offset=".45" stop-color="#e4e4e4" /><stop offset="1" stop-color="#8a8f98" /></linearGradient>
<marker id="tri-red" orient="auto-start-reverse" markerWidth="1" markerHeight="1" viewBox="0 0 1 1" refX="0" refY="0" style="overflow:visible" preserveAspectRatio="xMidYMid"><path transform="scale(0.5)" d="M 5.77,0 -2.88,5 V -5 Z" style="fill:#b5473a;fill-rule:evenodd;stroke:#b5473a;stroke-width:1pt" /></marker>
</defs>
<rect width="180" height="101" style="fill:white" />

