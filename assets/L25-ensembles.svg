<path d="M81,65 H68" style="fill:none;stroke:#b5473a;stroke-width:0.5;marker-end:url(#tri-red)" />
<text x="69" y="56" style="font-family:Arial;font-size:3.6px;text-anchor:middle;fill:#b5473a;font-weight:normal">Heat</text>
<text x="90" y="95" style="font-family:Arial;font-size:3.6px;text-anchor:middle;fill:#231f20;font-weight:normal">Heat exchange; fixed volume</text>
</g>
