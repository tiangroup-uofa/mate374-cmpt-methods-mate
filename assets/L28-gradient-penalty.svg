<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="150mm" height="86mm" viewBox="0 0 150 86">
<title>Energy of an interface in a composition field</title>
<desc>Top: Ag fraction rising smoothly from the Cu-rich value to the Ag-rich value across an interface. A dashed box inside the Cu-rich phase sees a uniform composition. A dashed box on the interface sees a steep change. Bottom: two energy terms peaked at the interface, the local free energy above the common tangent in blue and the gradient penalty in dashed red. Both are zero inside the phases.</desc>
