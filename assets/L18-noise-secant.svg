<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="66mm" viewBox="0 0 160 66">
<title>The same noise tilts a secant more when the points are closer</title>
<desc>Two panels with the same noisy data trend. Evenly spaced measured points scatter around a translucent grey exact curve, widely spaced in (a) and closely spaced in (b). The neighbours of the centre point are displaced by -delta and +delta. The red secant through them deviates little from the exact slope when h is large and strongly when h is small.</desc>
