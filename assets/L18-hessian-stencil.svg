<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="72mm" viewBox="0 0 160 72">
<title>Finite-difference stencils for the Hessian</title>
<desc>Two panels in the plane of coordinates q_i and q_j. Panel a: the diagonal entry H_ii uses the points -h, 0, +h along q_i with weights 1, -2, 1 divided by h squared. Panel b: the mixed entry H_ij uses the four corners (plus or minus h, plus or minus h) with weights +1, -1, -1, +1 divided by 4 h squared.</desc>
