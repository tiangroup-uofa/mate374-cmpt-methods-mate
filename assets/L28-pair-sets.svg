<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="128mm" height="64mm" viewBox="0 0 128 64">
<title>Pairs updated together in one parallel pass</title>
<desc>Two 8 by 8 periodic lattices. Red rounded outlines mark the horizontal pairs proposed together in one pass: every fourth column and every second row. Panel a shades the six neighbours read by one pair. Panel b shows a different pass shifted by two columns and one row.</desc>
