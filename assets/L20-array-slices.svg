<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="160mm" height="64mm" viewBox="0 0 160 64" version="1.1">
<title>Composite rules with NumPy slices</title>
<desc>a: the trapezoidal rule pairs y[:-1] with y[1:] and multiplies by the widths x[1:] - x[:-1]. b: Simpson 1/3 rule weights y[0] and y[-1] by 1, y[1:-1:2] by 4, and y[2:-1:2] by 2.</desc>
<rect width="160" height="64" fill="#ffffff"/>
<text x="2" y="7" style="font-family:Arial;font-size:6.35px;font-weight:bold;fill:#231f20">a</text>
<text x="9" y="7" style="font-family:Arial;font-size:4.23px;font-weight:bold;fill:#231f20">Trapezoidal rule</text>
<text x="18.0" y="31.3" style="font-family:Courier New;font-weight:bold;font-size:4.2px;fill:#231f20;text-anchor:end">y</text>
<rect x="20.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="24.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">0</text>
<rect x="28.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
