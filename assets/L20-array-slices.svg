<rect x="48.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
<text x="52.0" y="40.3" style="font-family:Arial;font-size:2.8px;font-style:italic;fill:#231f20;text-anchor:middle">h<tspan style="font-size:2.1px" dy="0.7">3</tspan></text>
<rect x="56.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
<text x="60.0" y="40.3" style="font-family:Arial;font-size:2.8px;font-style:italic;fill:#231f20;text-anchor:middle">h<tspan style="font-size:2.1px" dy="0.7">4</tspan></text>
<rect x="64.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
<text x="68.0" y="40.3" style="font-family:Arial;font-size:2.8px;font-style:italic;fill:#231f20;text-anchor:middle">h<tspan style="font-size:2.1px" dy="0.7">5</tspan></text>
<text x="48.0" y="46.0" style="font-family:Courier New;font-weight:bold;font-size:3.4px;fill:#2ca02c;text-anchor:middle">x[1:] - x[:-1]</text>
<text xml:space="preserve" x="4" y="54.0" style="font-family:Courier New;font-weight:bold;font-size:3.1px;fill:#231f20">np.sum((x[1:] - x[:-1])</text>
<text xml:space="preserve" x="4" y="58.5" style="font-family:Courier New;font-weight:bold;font-size:3.1px;fill:#231f20">       * (y[:-1] + y[1:]) / 2)</text>
<text xml:space="preserve" x="84" y="7" style="font-family:Arial;font-size:6.35px;font-weight:bold;fill:#231f20">b</text>
<text x="91" y="7" style="font-family:Arial;font-size:4.23px;font-weight:bold;fill:#231f20">Simpson's 1/3 rule</text>
<text x="92.0" y="31.3" style="font-family:Courier New;font-weight:bold;font-size:4.2px;fill:#231f20;text-anchor:end">y</text>
<rect x="94.0" y="27.0" width="8.0" height="6.0" style="fill:#d9d9d9;fill-opacity:0.6;stroke:#231f20;stroke-width:0.35"/>
<text x="98.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">0</text>
<rect x="102.0" y="27.0" width="8.0" height="6.0" style="fill:#b5473a;fill-opacity:0.25;stroke:#231f20;stroke-width:0.35"/>
<text x="106.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">1</text>
<rect x="110.0" y="27.0" width="8.0" height="6.0" style="fill:#1f77b4;fill-opacity:0.25;stroke:#231f20;stroke-width:0.35"/>
<text x="114.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">2</text>
<rect x="118.0" y="27.0" width="8.0" height="6.0" style="fill:#b5473a;fill-opacity:0.25;stroke:#231f20;stroke-width:0.35"/>
<text x="122.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">3</text>
<rect x="126.0" y="27.0" width="8.0" height="6.0" style="fill:#1f77b4;fill-opacity:0.25;stroke:#231f20;stroke-width:0.35"/>
<text x="130.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">4</text>
<rect x="134.0" y="27.0" width="8.0" height="6.0" style="fill:#b5473a;fill-opacity:0.25;stroke:#231f20;stroke-width:0.35"/>
<text x="138.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">5</text>
<rect x="142.0" y="27.0" width="8.0" height="6.0" style="fill:#d9d9d9;fill-opacity:0.6;stroke:#231f20;stroke-width:0.35"/>
<text x="146.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">6</text>
<path d="M 106.0,18 H 138.0" style="fill:none;stroke:#b5473a;stroke-width:0.45"/>
<path d="M 106.0,18 V 23.4" style="fill:none;stroke:#b5473a;stroke-width:0.45"/>
<path d="M 122.0,18 V 23.4" style="fill:none;stroke:#b5473a;stroke-width:0.45"/>
<path d="M 138.0,18 V 23.4" style="fill:none;stroke:#b5473a;stroke-width:0.45"/>
<text x="104.5" y="19.2" style="font-family:Courier New;font-weight:bold;font-size:3.4px;fill:#b5473a;text-anchor:end">y[1:-1:2]</text>
<path d="M 114.0,37.5 H 130.0" style="fill:none;stroke:#1f77b4;stroke-width:0.45"/>
<path d="M 114.0,37.5 V 33.6" style="fill:none;stroke:#1f77b4;stroke-width:0.45"/>
<path d="M 130.0,37.5 V 33.6" style="fill:none;stroke:#1f77b4;stroke-width:0.45"/>
<text x="112.5" y="38.7" style="font-family:Courier New;font-weight:bold;font-size:3.4px;fill:#1f77b4;text-anchor:end">y[2:-1:2]</text>
<text x="92.0" y="47.0" style="font-family:Arial;font-size:3.2px;fill:#231f20;text-anchor:end">weight</text>
<text x="98.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#231f20;text-anchor:middle">1</text>
<text x="106.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#b5473a;text-anchor:middle">4</text>
<text x="114.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#1f77b4;text-anchor:middle">2</text>
<text x="122.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#b5473a;text-anchor:middle">4</text>
<text x="130.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#1f77b4;text-anchor:middle">2</text>
<text x="138.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#b5473a;text-anchor:middle">4</text>
<text x="146.0" y="47.0" style="font-family:Arial;font-size:3.6px;font-weight:bold;fill:#231f20;text-anchor:middle">1</text>
<text xml:space="preserve" x="84" y="54.0" style="font-family:Courier New;font-weight:bold;font-size:3.1px;fill:#231f20">h / 3 * (y[0] + 4 * np.sum(y[1:-1:2])</text>
<text xml:space="preserve" x="84" y="58.5" style="font-family:Courier New;font-weight:bold;font-size:3.1px;fill:#231f20">        + 2 * np.sum(y[2:-1:2]) + y[-1])</text>
</svg>