<rect x="36.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="40.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">2</text>
<rect x="44.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="48.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">3</text>
<rect x="52.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="56.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">4</text>
<rect x="60.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="64.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">5</text>
<rect x="68.0" y="27.0" width="8.0" height="6.0" style="fill:#ffffff;fill-opacity:1;stroke:#231f20;stroke-width:0.35"/>
<text x="72.0" y="25.8" style="font-family:Arial;font-size:2.8px;fill:#8a8f98;text-anchor:middle">6</text>
<path d="M 20.6,17 V 15 H 67.4 V 17" style="fill:none;stroke:#4a3ab5;stroke-width:0.45;stroke-linejoin:round"/>
<text x="19.1" y="16.2" style="font-family:Courier New;font-weight:bold;font-size:3.4px;fill:#4a3ab5;text-anchor:end">y[:-1]</text>
<path d="M 28.6,22.5 V 20.5 H 75.4 V 22.5" style="fill:none;stroke:#1f77b4;stroke-width:0.45;stroke-linejoin:round"/>
<text x="27.1" y="21.7" style="font-family:Courier New;font-weight:bold;font-size:3.4px;fill:#1f77b4;text-anchor:end">y[1:]</text>
<rect x="24.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
<text x="28.0" y="40.3" style="font-family:Arial;font-size:2.8px;font-style:italic;fill:#231f20;text-anchor:middle">h<tspan style="font-size:2.1px" dy="0.7">0</tspan></text>
<rect x="32.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
<text x="36.0" y="40.3" style="font-family:Arial;font-size:2.8px;font-style:italic;fill:#231f20;text-anchor:middle">h<tspan style="font-size:2.1px" dy="0.7">1</tspan></text>
<rect x="40.4" y="37.0" width="7.2" height="4.6" style="fill:#2ca02c;fill-opacity:0.18;stroke:#2ca02c;stroke-width:0.3"/>
