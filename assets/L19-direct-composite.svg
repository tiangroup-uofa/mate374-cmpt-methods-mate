  <title id="title1">A direct trapezoid over the whole interval compared with a composite trapezoidal rule</title>
  <desc id="desc1">a: one trapezoid from a to b cuts straight across the wiggles of the curve. b: the interval is split into six subintervals x0 to x6, each covered by its own trapezoid, shaded alternately, and the trapezoids follow the curve closely.</desc>
