<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="170mm" height="78mm" viewBox="0 0 170 78">
<title>Time scales of MD and of atomic rearrangement in copper at 1000 K</title>
<desc>Logarithmic time axis from 1 fs to 10 s. A blue band marks the 46 ns that our GPU MD run covers in one day, and a grey band extends to 1 µs for the largest runs. One copper hop takes about 5 µs, and rearrangement over 5 nm about 2 ms, from the measured self-diffusion coefficient.</desc>
<defs>
<marker id="tri" orient="auto-start-reverse" markerWidth="1" markerHeight="1" viewBox="0 0 1 1" refX="0" refY="0" style="overflow:visible" preserveAspectRatio="xMidYMid">
<path transform="scale(0.5)" d="M 5.77,0 -2.88,5 V -5 Z" style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt" />
</marker>
<radialGradient id="atom-a" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.32"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#8a8f98" /></radialGradient>
<radialGradient id="atom-b" cx="0.5" cy="0.5" r="0.5" fx="0.35" fy="0.32"><stop offset="0" stop-color="#ffffff" /><stop offset="1" stop-color="#1f77b4" /></radialGradient>
</defs>
<rect width="170" height="78" style="fill:white" />
<g id="axis" inkscape:groupmode="layer" inkscape:label="Time axis and events">
<rect x="8.00" y="37.00" width="86.62" height="9.00" ry="0" style="fill:#e4e4e4;stroke:none;stroke-width:0.265" />
<path d="M94.62,37.00 L94.62,31.00" style="fill:none;stroke:#5e5e5e;stroke-width:0.3" />
<rect x="8.00" y="37.00" width="73.75" height="9.00" ry="0" style="fill:#cde5ec;stroke:none;stroke-width:0.265" />
<text x="80.25" y="42.80" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#1f77b4;text-anchor:end">one GPU day: 46 ns</text>
<text x="93.62" y="34.00" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#5e5e5e;text-anchor:end">largest runs</text>
<path d="M8.00,46.00 L165.00,46.00" style="fill:none;stroke:#231f20;stroke-width:0.5;marker-end:url(#tri)" />
<path d="M8.00,46.00 L8.00,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<path d="M36.88,46.00 L36.88,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<path d="M65.75,46.00 L65.75,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<path d="M94.62,46.00 L94.62,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<path d="M123.50,46.00 L123.50,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<path d="M152.38,46.00 L152.38,47.60" style="fill:none;stroke:#231f20;stroke-width:0.35" />
<text x="8.00" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 fs</text>
<text x="36.88" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 ps</text>
<text x="65.75" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 ns</text>
<text x="94.62" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 µs</text>
<text x="123.50" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 ms</text>
<text x="152.38" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">1 s</text>
<text x="165.00" y="51.60" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:italic;fill:#231f20;text-anchor:end">time</text>
<path d="M29.42,37.00 L29.42,21.20" style="fill:none;stroke:#231f20;stroke-width:0.35;stroke-dasharray:1.2,0.8" />
<circle cx="29.42" cy="46.00" r="1.1" style="fill:#231f20;stroke:none" />
<text x="29.42" y="16.00" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:middle">one Cu–Cu vibration</text>
<text x="29.42" y="20.00" style="font-family:Arial;font-size:3.53px;font-weight:bold;font-style:normal;fill:#231f20;text-anchor:middle">168 fs</text>
<path d="M101.09,46.00 L101.09,26.20" style="fill:none;stroke:#b5473a;stroke-width:0.35;stroke-dasharray:1.2,0.8" />
<circle cx="101.09" cy="46.00" r="1.1" style="fill:#b5473a;stroke:none" />
<text x="99.59" y="21.00" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#b5473a;text-anchor:end">one hop of an atom</text>
<text x="99.59" y="25.00" style="font-family:Arial;font-size:3.53px;font-weight:bold;font-style:normal;fill:#b5473a;text-anchor:end">about 5 µs</text>
<path d="M125.96,46.00 L125.96,21.20" style="fill:none;stroke:#b5473a;stroke-width:0.35;stroke-dasharray:1.2,0.8" />
<circle cx="125.96" cy="46.00" r="1.1" style="fill:#b5473a;stroke:none" />
<text x="127.46" y="16.00" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#b5473a;text-anchor:start">rearrangement over 5 nm</text>
<text x="127.46" y="20.00" style="font-family:Arial;font-size:3.53px;font-weight:bold;font-style:normal;fill:#b5473a;text-anchor:start">about 2 ms</text>
<path d="M81.75,59.00 L125.96,59.00" style="fill:none;stroke:#b5473a;stroke-width:0.5;marker-end:url(#tri);marker-start:url(#tri)" />
<text x="103.86" y="64.40" style="font-family:Arial;font-size:4.23px;font-weight:normal;font-style:normal;fill:#b5473a;text-anchor:middle">about 40 000 GPU days</text>
<text x="8.00" y="64.40" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:start">Cu self-diffusion at 1000 K:</text>
<text x="8.00" y="69.00" style="font-family:Arial;font-size:3.53px;font-weight:normal;font-style:normal;fill:#231f20;text-anchor:start"><tspan style="font-style:italic">D</tspan> ≈ 2.3 × 10<tspan style="font-size:2.9px" dy="-1.6">−15</tspan><tspan dy="1.6"> </tspan> m<tspan style="font-size:2.9px" dy="-1.6">2</tspan><tspan dy="1.6"> </tspan>/s</text>
</g>
</svg>
