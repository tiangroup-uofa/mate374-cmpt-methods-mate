<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="86mm" height="56mm" viewBox="0 0 86 56">
<title>The absolute value function has no derivative at x = 0</title>
<desc>f(x)=|x| has slope -1 for negative x and +1 for positive x. A central difference through x=-h and x=+h returns the horizontal slope 0, although f'(0) does not exist.</desc>
<defs>
<marker id="tri" orient="auto-start-reverse" markerWidth="1" markerHeight="1" viewBox="0 0 1 1" refX="0" refY="0" style="overflow:visible" preserveAspectRatio="xMidYMid"><path transform="scale(0.5)" d="M 5.77,0 -2.88,5 V -5 Z" style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"/></marker>

</defs>
<rect id="background" width="86" height="56" style="fill:#ffffff"/>
<g id="abs" inkscape:groupmode="layer" inkscape:label="|x|">
<path d="M 8.000,42.069 L 81.500,42.069" style="fill:none;stroke:#231f20;stroke-width:0.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#tri)"/>
<path d="M 43.000,48.000 L 43.000,4.500" style="fill:none;stroke:#231f20;stroke-width:0.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#tri)"/>
<text x="82.50" y="43.57" style="font-family:Arial;font-size:4.23px;fill:#231f20;font-weight:normal;font-style:normal;text-anchor:start"><tspan style="font-style:italic">x</tspan></text>
<text x="45.00" y="6.00" style="font-family:Arial;font-size:4.23px;fill:#231f20;font-weight:normal;font-style:normal;text-anchor:start"><tspan style="font-style:italic">f</tspan>(<tspan style="font-style:italic">x</tspan>) = |<tspan style="font-style:italic">x</tspan>|</text>
<path d="M 10.692,10.621 L 43.000,42.069" style="fill:none;stroke:#2ca02c;stroke-width:0.6;stroke-linecap:round;stroke-linejoin:round"/>
<path d="M 43.000,42.069 L 75.308,10.621" style="fill:none;stroke:#1f77b4;stroke-width:0.6;stroke-linecap:round;stroke-linejoin:round"/>
<text x="16.42" y="23.72" style="font-family:Arial;font-size:3.53px;fill:#2ca02c;font-weight:normal;font-style:normal;text-anchor:end">slope −1</text>
<text x="69.58" y="23.72" style="font-family:Arial;font-size:3.53px;fill:#1f77b4;font-weight:normal;font-style:normal;text-anchor:start">slope +1</text>
<path d="M 28.192,27.655 L 57.808,27.655" style="fill:none;stroke:#b5473a;stroke-width:0.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.5,1"/>
<path d="M 28.192,27.655 L 28.192,46.000" style="fill:none;stroke:#8a8f98;stroke-width:0.265;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.5,1"/>
<circle cx="28.192" cy="27.655" r="1.0" style="fill:#231f20;stroke:#231f20;stroke-width:0.3"/>
<path d="M 57.808,27.655 L 57.808,46.000" style="fill:none;stroke:#8a8f98;stroke-width:0.265;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1.5,1"/>
<circle cx="57.808" cy="27.655" r="1.0" style="fill:#231f20;stroke:#231f20;stroke-width:0.3"/>
<text x="28.19" y="46.57" style="font-family:Arial;font-size:3.53px;fill:#231f20;font-weight:normal;font-style:normal;text-anchor:middle">−<tspan style="font-style:italic">h</tspan></text>
<text x="57.81" y="46.57" style="font-family:Arial;font-size:3.53px;fill:#231f20;font-weight:normal;font-style:normal;text-anchor:middle"><tspan style="font-style:italic">h</tspan></text>
<text x="43.00" y="54.50" style="font-family:Arial;font-size:3.53px;fill:#b5473a;font-weight:normal;font-style:normal;text-anchor:middle">central difference returns slope 0</text>
</g>
</svg>
