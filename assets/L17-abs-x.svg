  <title
     id="title1">The absolute value function has no derivative at x = 0</title>
  <desc
     id="desc1">f(x)=|x| has slope -1 for negative x and +1 for positive x. A central difference through x=-h and x=+h returns the horizontal slope 0, although f'(0) does not exist.</desc>
